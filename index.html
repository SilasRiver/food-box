        .box-body::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(45deg,transparent 48%,rgba(255,255,255,.1) 49%,rgba(255,255,255,.1) 51%,transparent 52%),linear-gradient(-45deg,transparent 48%,rgba(255,255,255,.1) 49%,rgba(255,255,255,.1) 51%,transparent 52%);background-size:30px 30px}

        .blind-box.opening .box-body{animation:shake .5s ease}
        .blind-box.opened .box-lid{transform:translateY(-60px) rotate(-15deg);opacity:0}
        .blind-box.opened .box-question{animation:popOut .6s cubic-bezier(.68,-.55,.265,1.55) forwards}
        @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px) rotate(-2deg)}40%{transform:translateX(10px) rotate(2deg)}60%{transform:translateX(-6px) rotate(-1deg)}80%{transform:translateX(6px) rotate(1deg)}}
        @keyframes popOut{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
        .sparkles{position:absolute;top:50%;left:50%;width:200px;height:200px;transform:translate(-50%,-50%);pointer-events:none;z-index:10}

const COUPONS={"美团":[{amount:5,condition:"满30可用",title:"美团外卖红包",source:"美团"},{amount:8,condition:"满50可用",title:"美团神券",source:"美团"},{amount:15,condition:"满80可用",title:"美团大额券",source:"美团"}],"饿了么":[{amount:6,condition:"满25可用",title:"饿了么超级红包",source:"饿了么"},{amount:10,condition:"满60可用",title:"饿了么大额券",source:"饿了么"}],"抖音":[{amount:12,condition:"满50可用",title:"抖音团购券",source:"抖音"},{amount:20,condition:"满100可用",title:"抖音限时折扣",source:"抖音"}],"淘宝":[{amount:5,condition:"满20可用",title:"淘宝闪购红包",source:"淘宝"},{amount:10,condition:"满40可用",title:"淘特优惠券",source:"淘宝"}]};
const CUISINE_KEYWORDS={"中餐":["中餐","家常菜","炒菜","粤菜","川菜","湘菜","东北菜","面馆","饺子","拉面","烧腊","小吃"],"火锅":["火锅","涮肉","串串香"],"烧烤":["烧烤","烤肉","串串","炭火"],"日料":["日料","寿司","日式","料理"],"韩餐":["韩餐","韩式","炸鸡","拌饭"],"西餐":["西餐","披萨","牛排","汉堡","意面","西式"],"快餐":["快餐","麦当劳","肯德基","黄焖鸡","盖饭","便当","真功夫"],"奶茶":["奶茶","咖啡","甜品","饮品","茶饮","冰淇淋","蛋糕"]};
function guessCuisine(n,c){const t=`${n} ${c}`.toLowerCase();for(const[k,v]of Object.entries(CUISINE_KEYWORDS)){for(const w of v)if(t.includes(w))return k}return"中餐"}
function getCuisineEmoji(n,c){const t=`${n} ${c}`;if(t.includes("火锅")||t.includes("涮"))return"🫕";if(t.includes("烧烤")||t.includes("烤肉")||t.includes("串"))return"🍢";if(t.includes("寿司")||t.includes("日料"))return"🍣";if(t.includes("面")||t.includes("拉面"))return"🍜";if(t.includes("饺"))return"🥟";if(t.includes("鸡"))return"🍗";if(t.includes("茶")||t.includes("咖啡")||t.includes("甜"))return"🧋";if(t.includes("披萨"))return"🍕";if(t.includes("牛排"))return"🥩";if(t.includes("汉堡"))return"🍔";return"🍲"}
let state={location:null,locationName:"未知位置",restaurants:[],filteredRestaurants:[],currentRestaurant:null,filters:{cuisine:"all",distance:"all",price:"all"},isOpening:false};
document.addEventListener("DOMContentLoaded",()=>{initFilters();initLocation()});
function initLocation(){const lt=document.getElementById("locationText");let done=false;const fallback=function(){if(done)return;done=true;lt.textContent="📍 使用默认位置";state.location={...CONFIG.DEFAULT_LOCATION};searchNearby(CONFIG.DEFAULT_LOCATION.lat,CONFIG.DEFAULT_LOCATION.lng)};const timer=setTimeout(fallback,8000);lt.textContent="正在获取定位...";if(typeof AMap!=="undefined"&&AMap.Geolocation){var geolocation=new AMap.Geolocation({enableHighAccuracy:true,timeout:7000,buttonPosition:'RB'});geolocation.getCurrentPosition(function(status,result){if(done)return;done=true;clearTimeout(timer);if(status==="complete"){state.location={lat:result.position.lat,lng:result.position.lng};lt.textContent="📍 "+(result.formattedAddress||"定位成功");searchNearby(result.position.lat,result.position.lng)}else{fallback()}})}else if("geolocation"in navigator){navigator.geolocation.getCurrentPosition(function(p){if(done)return;done=true;clearTimeout(timer);state.location={lat:p.coords.latitude,lng:p.coords.longitude};lt.textContent="📍 定位成功";searchNearby(p.coords.latitude,p.coords.longitude)},function(){clearTimeout(timer);fallback()},{enableHighAccuracy:false,timeout:6000,maximumAge:300000})}else{clearTimeout(timer);fallback()}}
function searchNearby(lat,lng){const list=document.getElementById("restaurantList");list.innerHTML='<div class="loading">正在搜索附近餐厅...</div>';const cb="_cb_"+Date.now();window[cb]=function(data){delete window[cb];const old=document.getElementById("jsonp");if(old)old.remove();if(data.status==="1"&&data.pois&&data.pois.length>0){let id=1;const restaurants=data.pois.map(p=>{const[plng,plat]=p.location.split(",").map(Number);const dist=p.distance?parseInt(p.distance):0;const biz=p.biz_ext||{};const rating=biz.rating||(Math.random()*1.5+3.5).toFixed(1);const cost=biz.cost?parseInt(biz.cost.replace(/[^0-9]/g,"")):Math.floor(Math.random()*80+15);const cuisine=guessCuisine(p.name,p.type||"");return{id:id++,name:p.name,cuisine,emoji:getCuisineEmoji(p.name,p.type||""),rating,price:cost,distance:dist,address:p.address||"暂无地址",tags:[cuisine,p.type||""].filter(Boolean),tel:p.tel||"",latLng:{lat:plat,lng:plng}}});restaurants.sort((a,b)=>a.distance-b.distance);state.restaurants=restaurants;state.filteredRestaurants=[...restaurants];renderRestaurantList();showToast(`找到${restaurants.length}家附近餐厅`)}else{showToast("未搜到附近餐厅，使用示例数据");loadMockRestaurants()}};const sc=document.createElement("script");sc.id="jsonp";sc.src="https://restapi.amap.com/v3/place/around?key="+CONFIG.AMAP_KEY+"&location="+lng+","+lat+"&radius="+CONFIG.SEARCH_RADIUS+"&types=050000&offset=25&callback="+cb;sc.onerror=function(){delete window[cb];showToast("搜索失败，使用示例数据");loadMockRestaurants()};document.head.appendChild(sc);setTimeout(function(){if(window[cb]){delete window[cb];showToast("搜索超时，使用示例数据");loadMockRestaurants()}},8000)}
function manualSearch(){const val=document.getElementById("searchInput").value.trim();if(!val){showToast("请输入城市名或地址");return}const locs={"北京":{lat:39.9042,lng:116.4074},"上海":{lat:31.2304,lng:121.4737},"广州":{lat:23.1291,lng:113.2644},"深圳":{lat:22.5431,lng:114.0579},"杭州":{lat:30.2741,lng:120.1551},"成都":{lat:30.5728,lng:104.0668},"武汉":{lat:30.5928,lng:114.3055},"南京":{lat:32.0603,lng:118.7969},"西安":{lat:34.3416,lng:108.9398},"重庆":{lat:29.5630,lng:106.5516},"天津":{lat:39.0842,lng:117.2010},"苏州":{lat:31.2990,lng:120.5853},"长沙":{lat:28.2282,lng:112.9388},"郑州":{lat:34.7466,lng:113.6254},"青岛":{lat:36.0671,lng:120.3826},"厦门":{lat:24.4798,lng:118.0894},"大连":{lat:38.9140,lng:121.6147},"宁波":{lat:29.8683,lng:121.5440},"福州":{lat:26.0745,lng:119.2965},"合肥":{lat:31.8206,lng:117.2272}};const loc=locs[val];if(loc){state.location=loc;state.locationName=val;document.getElementById("locationText").textContent=`📍 ${val}`;searchNearby(loc.lat,loc.lng);showToast(`已定位到：${val}`)}else{showToast("试试：北京、上海、广州、深圳、杭州等城市名")}}
function loadMockRestaurants(){const d=MOCK_RESTAURANTS.map(r=>({...r,distance:Math.floor(Math.random()*1500)+50}));state.restaurants=d;state.filteredRestaurants=[...d];renderRestaurantList()}
function initFilters(){document.querySelectorAll(".tag-list").forEach(tl=>{tl.addEventListener("click",e=>{if(!e.target.classList.contains("tag"))return;tl.querySelectorAll(".tag").forEach(t=>t.classList.remove("active"));e.target.classList.add("active");const g=tl.id,v=e.target.dataset.value;if(g==="cuisineTags")state.filters.cuisine=v;if(g==="distanceTags")state.filters.distance=v;if(g==="priceTags")state.filters.price=v;applyFilters()})})}
function applyFilters(){let f=[...state.restaurants];if(state.filters.cuisine!=="all")f=f.filter(r=>r.cuisine===state.filters.cuisine);if(state.filters.distance!=="all"){const m=parseInt(state.filters.distance);f=f.filter(r=>r.distance<=m)}if(state.filters.price!=="all"){const m=parseInt(state.filters.price);f=f.filter(r=>r.price<=m)}state.filteredRestaurants=f;renderRestaurantList()}
function renderRestaurantList(){const list=document.getElementById("restaurantList"),count=document.getElementById("restaurantCount"),r=state.filteredRestaurants;count.textContent=`(${r.length}家)`;if(r.length===0){list.innerHTML='<div class="loading">😅 没有找到符合条件的餐厅，试试放宽筛选</div>';return}list.innerHTML=r.sort((a,b)=>a.distance-b.distance).map(i=>`<div class="restaurant-item" onclick="selectRestaurant(${i.id})"><div class="restaurant-emoji">${i.emoji}</div><div class="restaurant-info"><div class="restaurant-name">${i.name}</div><div class="restaurant-meta"><span>⭐ ${i.rating}</span><span>💰 ¥${i.price}/人</span><span>📍 ${fmtDist(i.distance)}</span></div></div><span class="restaurant-coupon-tag">有券</span></div>`).join("")}
function fmtDist(m){return m<1000?`${m}m`:`${(m/1000).toFixed(1)}km`}
function openBox(){if(state.isOpening)return;const r=state.filteredRestaurants;if(r.length===0){showToast("没有符合条件的餐厅，请调整筛选");return}document.getElementById("resultPage").classList.remove("active");document.getElementById("app").classList.add("active");state.isOpening=true;const b=document.getElementById("blindBox"),h=document.getElementById("boxHint"),s=document.getElementById("sparkles");b.className="blind-box";h.textContent="正在抽取...";setTimeout(()=>{b.classList.add("opening");createSparkles(s)},100);setTimeout(()=>{b.classList.add("opened")},600);setTimeout(()=>{const ri=Math.floor(Math.random()*r.length);state.currentRestaurant=r[ri];showResult(r[ri]);setTimeout(()=>{b.className="blind-box";h.textContent="点击盲盒，揭晓今天吃什么";state.isOpening=false},500)},1200)}
function createSparkles(c){c.innerHTML="";const colors=["#FF6B35","#FFD166","#06D6A0","#EF476F","#118AB2"];for(let i=0;i<12;i++){const sp=document.createElement("div");sp.className="sparkle";const a=(Math.PI*2*i)/12,d=40+Math.random()*40;sp.style.setProperty("--tx",`${Math.cos(a)*d}px`);sp.style.setProperty("--ty",`${Math.sin(a)*d}px`);sp.style.background=colors[Math.floor(Math.random()*colors.length)];sp.style.left="50%";sp.style.top="50%";c.appendChild(sp)}setTimeout(()=>{c.innerHTML=""},1000)}
function showResult(r){document.getElementById("app").classList.remove("active");document.getElementById("resultPage").classList.add("active");document.getElementById("resultEmoji").textContent=r.emoji;document.getElementById("resultName").textContent=r.name;document.getElementById("resultDistance").textContent=fmtDist(r.distance);document.getElementById("resultRating").textContent=r.rating;document.getElementById("resultPrice").textContent=`¥${r.price}`;document.getElementById("resultAddress").textContent=r.address;document.getElementById("resultTags").innerHTML=r.tags.map(t=>`<span class="result-tag">${t}</span>`).join("");renderCoupons(r);document.getElementById("btnGo").onclick=()=>{window.open(`https://uri.amap.com/marker?position=${r.latLng.lng},${r.latLng.lat}&name=${encodeURIComponent(r.name)}`,"_blank")};window.scrollTo(0,0)}
function renderCoupons(r){const cl=document.getElementById("couponList");const all=[];Object.keys(COUPONS).forEach(p=>{COUPONS[p].forEach(c=>{if(c.amount<=r.price*0.5)all.push({...c,source:p})})});for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]]}const sel=all.slice(0,Math.min(4,all.length));if(sel.length===0){cl.innerHTML='<div class="no-coupon">暂无可用优惠券</div>';return}cl.innerHTML=sel.map(c=>`<div class="coupon-item"><div class="coupon-left"><div class="coupon-amount"><small>¥</small>${c.amount}</div><div class="coupon-condition">${c.condition}</div></div><div class="coupon-right"><div class="coupon-title">${c.title}</div><div class="coupon-source">来源：${c.source}</div><button class="coupon-btn" onclick="claimCoupon('${c.source}','${c.title}')">领取</button></div></div>`).join("")}
function claimCoupon(s,t){showToast(`✅ 已领取「${t}」`)}
function goBack(){document.getElementById("resultPage").classList.remove("active");document.getElementById("app").classList.add("active");window.scrollTo(0,0)}
function selectRestaurant(id){const r=state.restaurants.find(i=>i.id===id);if(r){state.currentRestaurant=r;showResult(r)}}
function showToast(m,d=2500){document.querySelectorAll(".toast").forEach(t=>t.remove());const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>{t.classList.add("hiding");setTimeout(()=>t.remove(),300)},d)}
    </script>
