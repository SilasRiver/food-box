<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>今天吃什么 - 盲盒美食</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#FFF8F0;color:#2D2D2D;min-height:100vh}
        .header{background:linear-gradient(135deg,#FF6B35,#FF8F65);padding:16px 20px;position:sticky;top:0;z-index:100}
        .loc{display:flex;align-items:center;gap:6px;color:#fff;font-size:14px;padding:6px 12px;background:rgba(255,255,255,.2);border-radius:20px;cursor:pointer}
        .sr{display:flex;gap:8px;margin-top:10px}
        .sr input{flex:1;padding:8px 12px;border:none;border-radius:12px;font-size:13px;background:rgba(255,255,255,.2);color:#fff;outline:none}
        .sr input::placeholder{color:rgba(255,255,255,.6)}
        .sr button{padding:8px 16px;border:none;border-radius:12px;background:rgba(255,255,255,.3);color:#fff;font-size:13px;cursor:pointer}
        .main{padding:0 16px 40px;max-width:480px;margin:0 auto}
        .title{text-align:center;padding:24px 0 16px}
        .title h1{font-size:32px;font-weight:800;background:linear-gradient(135deg,#FF6B35,#EF476F);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .title p{color:#888;font-size:14px;margin-top:4px}
        .box-area{display:flex;flex-direction:column;align-items:center;padding:16px 0 24px}
        .box{width:140px;height:140px;position:relative;cursor:pointer}
        .box:active{transform:scale(.95)}
        .box-lid{width:150px;height:36px;background:linear-gradient(135deg,#FF6B35,#E55A2B);border-radius:10px 10px 0 0;position:absolute;top:0;left:-5px;z-index:2;transition:all .4s ease}
        .box-lid::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:36px;height:10px;background:#FFD166;border-radius:5px}
        .box-body{width:140px;height:104px;background:linear-gradient(180deg,#FF8F65,#FF6B35);border-radius:0 0 14px 14px;position:absolute;top:32px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(255,107,53,.2)}
        .box-q{font-size:52px;font-weight:900;color:#fff;animation:float 2s ease-in-out infinite}
        @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
        .box.open .box-lid{transform:translateY(-50px) rotate(-15deg);opacity:0}
        .box.open .box-body{animation:shake .4s ease}
        @keyframes shake{20%{transform:translateX(-8px) rotate(-2deg)}60%{transform:translateX(8px) rotate(2deg)}}
        .box-hint{margin-top:16px;color:#888;font-size:13px}
        .card{background:#fff;border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
        .card h3{font-size:15px;margin-bottom:12px}
        .fg{margin-bottom:12px}
        .fg:last-child{margin-bottom:0}
        .fg label{display:block;font-size:12px;color:#888;margin-bottom:6px}
        .tags{display:flex;flex-wrap:wrap;gap:6px}
        .tag{padding:5px 12px;border-radius:16px;font-size:12px;background:#F5F5F5;color:#666;cursor:pointer;border:2px solid transparent}
        .tag.on{background:linear-gradient(135deg,#FF6B35,#FF8F65);color:#fff;border-color:#FF6B35}
        .ri{display:flex;align-items:center;gap:12px;padding:12px;background:#FAFAFA;border-radius:12px;margin-bottom:8px;cursor:pointer;border:2px solid transparent}
        .ri:last-child{margin-bottom:0}
        .ri:active{border-color:#FF6B35}
        .ri-e{font-size:32px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:10px;flex-shrink:0}
        .ri-i{flex:1;min-width:0}
        .ri-n{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .ri-m{display:flex;gap:10px;font-size:11px;color:#888;margin-top:3px}
        .ri-t{font-size:10px;background:linear-gradient(135deg,#FF6B35,#EF476F);color:#fff;padding:2px 8px;border-radius:10px;flex-shrink:0}
        .ld{text-align:center;color:#888;padding:24px;font-size:13px}
        .map-box{width:100%;height:180px;background:#f0f0f0;border-radius:12px;margin-top:10px;overflow:hidden;position:relative}
        .map-box iframe{width:100%;height:100%;border:none}
        .page{display:none;min-height:100vh;background:#FFF8F0}
        .page.on{display:block}
        .rh{display:flex;align-items:center;gap:12px;padding:16px 20px;position:sticky;top:0;background:#FFF8F0;z-index:10}
        .rh button{background:none;border:none;font-size:15px;color:#FF6B35;cursor:pointer}
        .rh h2{font-size:18px}
        .rc{background:#fff;border-radius:20px;overflow:hidden;margin:0 16px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
        .rt{padding:28px 20px;text-align:center;background:linear-gradient(135deg,#FF6B35,#FF8F65);color:#fff}
        .rt-e{font-size:56px;margin-bottom:10px}
        .rt h2{font-size:22px;margin-bottom:8px}
        .rt-t{display:flex;justify-content:center;gap:6px;margin-bottom:14px;flex-wrap:wrap}
        .rt-t span{padding:3px 10px;background:rgba(255,255,255,.25);border-radius:10px;font-size:11px}
        .rt-i{display:flex;justify-content:center;gap:20px;margin-bottom:10px}
        .rt-i div{display:flex;flex-direction:column;align-items:center;gap:3px}
        .rt-i div:first-child{font-size:11px;opacity:.8}
        .rt-i div:last-child{font-size:15px;font-weight:600}
        .rt-a{font-size:12px;opacity:.8}
        .cp{padding:16px 20px}
        .cp h3{font-size:15px;margin-bottom:12px}
        .ci{display:flex;border:2px dashed #FFB088;border-radius:12px;overflow:hidden;margin-bottom:8px;background:#FFF9F5}
        .ci:last-child{margin-bottom:0}
        .ci-l{padding:10px 14px;text-align:center;min-width:80px;background:linear-gradient(135deg,#FF6B35,#FF8F65);color:#fff}
        .ci-l .amt{font-size:24px;font-weight:800;line-height:1}
        .ci-l .cond{font-size:10px;opacity:.8;margin-top:3px}
        .ci-r{flex:1;padding:10px 14px}
        .ci-r .ttl{font-size:13px;font-weight:600;margin-bottom:2px}
        .ci-r .src{font-size:11px;color:#888;margin-bottom:6px}
        .ci-r button{padding:3px 12px;background:linear-gradient(135deg,#FF6B35,#FF8F65);color:#fff;border:none;border-radius:12px;font-size:11px;cursor:pointer}
        .no-cp{text-align:center;color:#888;font-size:13px;padding:16px}
        .ra{display:flex;gap:10px;padding:16px 20px}
        .ra button{flex:1;padding:12px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer}
        .ra .btn-r{background:#F5F5F5;color:#333}
        .ra .btn-g{background:linear-gradient(135deg,#06D6A0,#00B894);color:#fff}
        .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;z-index:999;white-space:nowrap}
    </style>
</head>
<body>
    <div id="app">
        <div class="header">
            <div class="loc" onclick="doLocate()">📍 <span id="locText">正在定位...</span> <span style="font-size:11px;opacity:.7">⟳</span></div>
            <div class="sr">
                <input id="cityInput" placeholder="输入城市名搜索（如北京）">
                <button onclick="searchCity()">搜索</button>
            </div>
        </div>
        <div class="main">
            <div class="title"><h1>🍱 今天吃什么</h1><p>选择困难症终结者</p></div>
            <div class="box-area">
                <div class="box" id="box" onclick="openBox()"><div class="box-lid"></div><div class="box-body"><div class="box-q">?</div></div></div>
                <div class="box-hint" id="boxHint">点击盲盒，揭晓今天吃什么</div>
            </div>
            <div class="card">
                <h3>🗺️ 我的位置 <span style="font-size:12px;color:#FF6B35;cursor:pointer" onclick="toggleMap()">展开/收起</span></h3>
                <div class="map-box" id="mapBox" style="display:none"></div>
            </div>
            <div class="card">
                <h3>🎯 筛选偏好</h3>
                <div class="fg"><label>菜系</label><div class="tags" id="tC"><span class="tag on" data-v="all">全部</span><span class="tag" data-v="中餐">中餐</span><span class="tag" data-v="火锅">火锅</span><span class="tag" data-v="烧烤">烧烤</span><span class="tag" data-v="日料">日料</span><span class="tag" data-v="韩餐">韩餐</span><span class="tag" data-v="西餐">西餐</span><span class="tag" data-v="快餐">快餐</span><span class="tag" data-v="奶茶">奶茶</span></div></div>
                <div class="fg"><label>距离</label><div class="tags" id="tD"><span class="tag on" data-v="all">不限</span><span class="tag" data-v="500">500米</span><span class="tag" data-v="1000">1公里</span><span class="tag" data-v="2000">2公里</span></div></div>
                <div class="fg"><label>人均</label><div class="tags" id="tP"><span class="tag on" data-v="all">不限</span><span class="tag" data-v="20">20以下</span><span class="tag" data-v="50">50以下</span><span class="tag" data-v="100">100以下</span><span class="tag" data-v="200">200以下</span></div></div>
            </div>
            <div class="card"><h3>🏪 附近餐厅 <small id="cnt"></small></h3><div id="rList"><div class="ld">正在搜索...</div></div></div>
        </div>
    </div>
    <div class="page" id="rp">
        <div class="rh"><button onclick="goBack()">← 返回</button><h2>🎉 今日推荐</h2></div>
        <div class="rc">
            <div class="rt"><div class="rt-e" id="rE"></div><h2 id="rN"></h2><div class="rt-t" id="rT"></div><div class="rt-i"><div><span>📍 距离</span><span id="rD"></span></div><div><span>⭐ 评分</span><span id="rR"></span></div><div><span>💰 人均</span><span id="rC"></span></div></div><div class="rt-a" id="rA"></div></div>
            <div class="cp"><h3>🎫 可用优惠</h3><div id="cL"></div></div>
            <div class="ra"><button class="btn-r" onclick="openBox()">🔄 换一个</button><button class="btn-g" id="btnGo">🛵 去这里吃</button></div>
        </div>
    </div>
    <script>
var AK="bec3d90674f1207515e959f4ddbfd512";
var R=2000;
var DEF={lat:39.9042,lng:116.4074};
var S={loc:null,rest:[],filtered:[],cur:null,f:{c:"all",d:"all",p:"all"},opening:false,mapOpen:false};
var MOCKS=[
{id:1,n:"老王家常菜",c:"中餐",e:"🍳",r:4.5,p:35,d:320,a:"幸福路88号"},
{id:2,n:"川味麻辣烫",c:"中餐",e:"🌶️",r:4.3,p:25,d:180,a:"和平街12号"},
{id:3,n:"粤式烧腊王",c:"中餐",e:"🦆",r:4.6,p:42,d:560,a:"中山路156号"},
{id:4,n:"兰州拉面馆",c:"中餐",e:"🍜",r:4.2,p:18,d:150,a:"建设路23号"},
{id:5,n:"海底捞火锅",c:"火锅",e:"🫕",r:4.7,p:120,d:1200,a:"万达广场3楼"},
{id:6,n:"小龙坎火锅",c:"火锅",e:"🍲",r:4.5,p:98,d:890,a:"解放路78号"},
{id:7,n:"炭火烧烤",c:"烧烤",e:"🍢",r:4.4,p:55,d:380,a:"夜市街15号"},
{id:8,n:"韩式烤肉",c:"烧烤",e:"🥩",r:4.6,p:88,d:650,a:"新城区28号"},
{id:9,n:"寿司の鲜",c:"日料",e:"🍣",r:4.5,p:85,d:720,a:"国际广场B1"},
{id:10,n:"首尔拌饭",c:"韩餐",e:"🍚",r:4.3,p:42,d:510,a:"韩式料理街3号"},
{id:11,n:"意式披萨坊",c:"西餐",e:"🍕",r:4.4,p:68,d:580,a:"欧陆风情街8号"},
{id:12,n:"麦当劳",c:"快餐",e:"🍟",r:4.0,p:30,d:200,a:"中心广场旁"},
{id:13,n:"黄焖鸡米饭",c:"快餐",e:"🍗",r:4.2,p:20,d:120,a:"学校旁边"},
{id:14,n:"喜茶",c:"奶茶",e:"🧋",r:4.6,p:28,d:400,a:"购物中心1楼"},
{id:15,n:"蜜雪冰城",c:"奶茶",e:"🍦",r:4.3,p:8,d:100,a:"学校门口"}
];
var CPN={美团:[{a:5,c:"满30可用",t:"美团外卖红包"},{a:8,c:"满50可用",t:"美团神券"},{a:15,c:"满80可用",t:"美团大额券"}],饿了么:[{a:6,c:"满25可用",t:"饿了么超级红包"},{a:10,c:"满60可用",t:"饿了么大额券"}],抖音:[{a:12,c:"满50可用",t:"抖音团购券"},{a:20,c:"满100可用",t:"抖音限时折扣"}],淘宝:[{a:5,c:"满20可用",t:"淘宝闪购红包"},{a:10,c:"满40可用",t:"淘特优惠券"}]};
var CKW={中餐:["中餐","家常菜","粤菜","川菜","湘菜","面馆","饺子","烧腊"],火锅:["火锅","涮肉"],烧烤:["烧烤","烤肉","串串"],日料:["日料","寿司","日式"],韩餐:["韩餐","韩式","炸鸡"],西餐:["西餐","披萨","牛排","汉堡"],快餐:["快餐","麦当劳","肯德基","黄焖鸡"],奶茶:["奶茶","咖啡","甜品","茶饮"]};
var CITYS={北京:{lat:39.9042,lng:116.4074},上海:{lat:31.2304,lng:121.4737},广州:{lat:23.1291,lng:113.2644},深圳:{lat:22.5431,lng:114.0579},杭州:{lat:30.2741,lng:120.1551},成都:{lat:30.5728,lng:104.0668},武汉:{lat:30.5928,lng:114.3055},南京:{lat:32.0603,lng:118.7969},西安:{lat:34.3416,lng:108.9398},重庆:{lat:29.563,lng:106.5516},天津:{lat:39.0842,lng:117.201},苏州:{lat:31.299,lng:120.5853},长沙:{lat:28.2282,lng:112.9388},郑州:{lat:34.7466,lng:113.6254},青岛:{lat:36.0671,lng:120.3826},厦门:{lat:24.4798,lng:118.0894}};

function guessC(n,c){var t=(n+" "+c).toLowerCase();for(var k in CKW)for(var i=0;i<CKW[k].length;i++)if(t.indexOf(CKW[k][i])>=0)return k;return"中餐"}
function getE(n,c){var t=n+" "+c;if(t.indexOf("火锅")>=0||t.indexOf("涮")>=0)return"🫕";if(t.indexOf("烧烤")>=0||t.indexOf("烤肉")>=0)return"🍢";if(t.indexOf("寿司")>=0||t.indexOf("日料")>=0)return"🍣";if(t.indexOf("面")>=0)return"🍜";if(t.indexOf("饺")>=0)return"🥟";if(t.indexOf("鸡")>=0)return"🍗";if(t.indexOf("茶")>=0||t.indexOf("咖啡")>=0)return"🧋";if(t.indexOf("披萨")>=0)return"🍕";if(t.indexOf("牛排")>=0)return"🥩";if(t.indexOf("汉堡")>=0)return"🍔";return"🍲"}
function fmtD(m){return m<1000?m+"m":(m/1000).toFixed(1)+"km"}

document.addEventListener("DOMContentLoaded",function(){initF();doLocate()});

function doLocate(){
    var lt=document.getElementById("locText");
    lt.textContent="正在定位...";
    if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(function(p){
            S.loc={lat:p.coords.latitude,lng:p.coords.longitude};
            lt.textContent="定位成功 ("+S.loc.lat.toFixed(2)+","+S.loc.lng.toFixed(2)+")";
            doSearch(S.loc.lat,S.loc.lng);
        },function(){
            lt.textContent="定位失败，请手动搜索";
            S.loc={lat:DEF.lat,lng:DEF.lng};
            loadMock();
        },{enableHighAccuracy:false,timeout:5000,maximumAge:300000});
    }else{
        lt.textContent="不支持定位";
        S.loc={lat:DEF.lat,lng:DEF.lng};
        loadMock();
    }
}

function doSearch(lat,lng){
    var list=document.getElementById("rList");
    list.innerHTML='<div class="ld">正在搜索附近餐厅...</div>';
    var cbName="amapCb_"+Date.now();
    window[cbName]=function(data){
        delete window[cbName];
        var old=document.getElementById("amapJsonp");
        if(old)old.remove();
        if(data&&data.status==="1"&&data.pois&&data.pois.length>0){
            var id=1;
            var arr=data.pois.map(function(p){
                var loc=p.location.split(",");
                var plng=parseFloat(loc[0]);
                var plat=parseFloat(loc[1]);
                var dist=p.distance?parseInt(p.distance):0;
                var biz=p.biz_ext||{};
                var rating=biz.rating||"4.2";
                var cost=biz.cost?parseInt(biz.cost.replace(/\D/g,"")):35;
                var cuisine=guessC(p.name,p.type||"");
                return{id:id++,n:p.name,c:cuisine,e:getE(p.name,p.type||""),r:rating,p:cost,d:dist,a:p.address||"暂无地址",latLng:{lat:plat,lng:plng}}
            });
            arr.sort(function(a,b){return a.d-b.d});
            S.rest=arr;
            S.filtered=arr.slice();
            renderList();
            toast("找到"+arr.length+"家附近餐厅");
            updateMap(arr);
        }else{
            toast("未搜到附近餐厅，使用示例数据");
            loadMock();
        }
    };
    var script=document.createElement("script");
    script.id="amapJsonp";
    script.src="https://restapi.amap.com/v3/place/around?key="+AK+"&location="+lng+","+lat+"&radius="+R+"&types=050000&offset=25&callback="+cbName;
    script.onerror=function(){
        delete window[cbName];
        toast("搜索失败，使用示例数据");
        loadMock();
    };
    document.head.appendChild(script);
    setTimeout(function(){
        if(window[cbName]){
            delete window[cbName];
            toast("搜索超时，使用示例数据");
            loadMock();
        }
    },8000);
}

function updateMap(arr){
    var mb=document.getElementById("mapBox");
    if(!S.loc)return;
    var lat=S.loc.lat;
    var lng=S.loc.lng;
    var markers="markers=size:mid|color:red|label:我|"+lng+","+lat;
    if(arr&&arr.length>0){
        arr.slice(0,10).forEach(function(r,i){
            if(r.latLng)markers+="|size:small|color:blue|label:"+(i+1)+"|"+r.latLng.lng+","+r.latLng.lat;
        });
    }
    mb.innerHTML='<iframe src="https://restapi.amap.com/v3/staticmap?location='+lng+','+lat+'&zoom=14&size=600*300&'+markers+'&key='+AK+'" allowfullscreen></iframe>';
}

function toggleMap(){
    var mb=document.getElementById("mapBox");
    S.mapOpen=!S.mapOpen;
    mb.style.display=S.mapOpen?"block":"none";
    if(S.mapOpen)updateMap(S.filtered);
}

function loadMock(){
    S.rest=MOCKS.map(function(r){return{id:r.id,n:r.n,c:r.c,e:r.e,r:r.r,p:r.p,d:Math.floor(Math.random()*1500)+50,a:r.a,latLng:null}});
    S.filtered=S.rest.slice();
    renderList();
}

function searchCity(){
    var v=document.getElementById("cityInput").value.trim();
    if(!v){toast("请输入城市名");return}
    var loc=CITYS[v];
    if(loc){
        S.loc=loc;
        document.getElementById("locText").textContent=v+" ("+loc.lat.toFixed(2)+","+loc.lng.toFixed(2)+")";
        doSearch(loc.lat,loc.lng);
        toast("已定位到："+v);
    }else{
        toast("试试：北京、上海、广州、深圳等");
    }
}

function initF(){
    document.querySelectorAll(".tags").forEach(function(tl){
        tl.addEventListener("click",function(e){
            if(!e.target.classList.contains("tag"))return;
            tl.querySelectorAll(".tag").forEach(function(t){t.classList.remove("on")});
            e.target.classList.add("on");
            var g=tl.id,v=e.target.getAttribute("data-v");
            if(g==="tC")S.f.c=v;
            if(g==="tD")S.f.d=v;
            if(g==="tP")S.f.p=v;
            applyF();
        });
    });
}

function applyF(){
    var f=S.rest.slice();
    if(S.f.c!=="all")f=f.filter(function(r){return r.c===S.f.c});
    if(S.f.d!=="all"){var m=parseInt(S.f.d);f=f.filter(function(r){return r.d<=m})}
    if(S.f.p!=="all"){var m=parseInt(S.f.p);f=f.filter(function(r){return r.p<=m})}
    S.filtered=f;
    renderList();
}

function renderList(){
    var list=document.getElementById("rList");
    document.getElementById("cnt").textContent="("+S.filtered.length+"家)";
    if(!S.filtered.length){list.innerHTML='<div class="ld">😅 没有符合条件的餐厅</div>';return}
    S.filtered.sort(function(a,b){return a.d-b.d});
    list.innerHTML=S.filtered.map(function(r){
        return '<div class="ri" onclick="selR('+r.id+')"><div class="ri-e">'+r.e+'</div><div class="ri-i"><div class="ri-n">'+r.n+'</div><div class="ri-m"><span>⭐ '+r.r+'</span><span>💰 ¥'+r.p+'/人</span><span>📍 '+fmtD(r.d)+'</span></div></div><span class="ri-t">有券</span></div>'
    }).join("");
}

function openBox(){
    if(S.opening)return;
    if(!S.filtered.length){toast("没有符合条件的餐厅");return}
    document.getElementById("rp").classList.remove("on");
    document.getElementById("app").style.display="block";
    S.opening=true;
    var b=document.getElementById("box");
    document.getElementById("boxHint").textContent="正在抽取...";
    b.classList.add("open");
    setTimeout(function(){
        var r=S.filtered[Math.floor(Math.random()*S.filtered.length)];
        S.cur=r;
        showResult(r);
        b.classList.remove("open");
        document.getElementById("boxHint").textContent="点击盲盒，揭晓今天吃什么";
        S.opening=false;
    },1000);
}

function showResult(r){
    document.getElementById("app").style.display="none";
    document.getElementById("rp").classList.add("on");
    document.getElementById("rE").textContent=r.e;
    document.getElementById("rN").textContent=r.n;
    document.getElementById("rD").textContent=fmtD(r.d);
    document.getElementById("rR").textContent=r.r;
    document.getElementById("rC").textContent="¥"+r.p;
    document.getElementById("rA").textContent="📍 "+r.a;
    document.getElementById("rT").innerHTML="<span>"+r.c+"</span>";
    renderC(r);
    document.getElementById("btnGo").onclick=function(){
        if(r.latLng)window.open("https://uri.amap.com/marker?position="+r.latLng.lng+","+r.latLng.lat+"&name="+encodeURIComponent(r.n));
        else toast("🛵 出发去 "+r.n+"！");
    };
    window.scrollTo(0,0);
}

function renderC(r){
    var cl=document.getElementById("cL");
    var all=[];
    for(var p in CPN)CPN[p].forEach(function(c){if(c.a<=r.p*0.6)all.push({a:c.a,c:c.c,t:c.t,s:p})});
    for(var i=all.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=all[i];all[i]=all[j];all[j]=tmp}
    var sel=all.slice(0,Math.min(3,all.length));
    if(!sel.length){cl.innerHTML='<div class="no-cp">暂无可用优惠券</div>';return}
    cl.innerHTML=sel.map(function(c){
        return '<div class="ci"><div class="ci-l"><div class="amt">¥'+c.a+'</div><div class="cond">'+c.c+'</div></div><div class="ci-r"><div class="ttl">'+c.t+'</div><div class="src">来源：'+c.s+'</div><button onclick="toast(\'✅ 已领取\')">领取</button></div></div>'
    }).join("");
}

function selR(id){var r=S.rest.find(function(i){return i.id===id});if(r){S.cur=r;showResult(r)}}
function goBack(){document.getElementById("rp").classList.remove("on");document.getElementById("app").style.display="block";window.scrollTo(0,0)}
function toast(m){var t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2500)}
    </script>
</body>
</html>
