                <div class="fg"><label>距离</label><div class="tags" id="tDist"><span class="tag on" data-v="all">不限</span><span class="tag" data-v="500">500米</span><span class="tag" data-v="1000">1公里</span><span class="tag" data-v="2000">2公里</span></div></div>
                <div class="fg"><label>人均</label><div class="tags" id="tPrice"><span class="tag on" data-v="all">不限</span><span class="tag" data-v="20">20以下</span><span class="tag" data-v="50">50以下</span><span class="tag" data-v="100">100以下</span><span class="tag" data-v="200">200以下</span></div></div>

            <div class="cp"><h3>🎫 可用优惠</h3><div id="cList"></div></div>
            <div class="ra"><button class="btn-r" onclick="openBox()">🔄 换一个</button><button class="btn-g" id="btnGo">🛵 去这里吃</button></div>

    <script>
var KEY="0a2336ce57d58d48e8839e9c3890645a";
var REST_KEY="bec3d90674f1207515e959f4ddbfd512";
var RADIUS=2000;
var DEF={lat:39.9042,lng:116.4074};
var S={loc:null,locName:"未知",rest:[],filtered:[],cur:null,f:{cuisine:"all",dist:"all",price:"all"},opening:false,map:null,markers:[],mapOpen:false};
var MOCKS=[{id:1,name:"老王家常菜",cuisine:"中餐",emoji:"🍳",rating:4.5,price:35,dist:320,addr:"幸福路88号"},{id:2,name:"川味麻辣烫",cuisine:"中餐",emoji:"🌶️",rating:4.3,price:25,dist:180,addr:"和平街12号"},{id:3,name:"粤式烧腊王",cuisine:"中餐",emoji:"🦆",rating:4.6,price:42,dist:560,addr:"中山路156号"},{id:4,name:"兰州拉面馆",cuisine:"中餐",emoji:"🍜",rating:4.2,price:18,dist:150,addr:"建设路23号"},{id:5,name:"海底捞火锅",cuisine:"火锅",emoji:"🫕",rating:4.7,price:120,dist:1200,addr:"万达广场3楼"},{id:6,name:"小龙坎火锅",cuisine:"火锅",emoji:"🍲",rating:4.5,price:98,dist:890,addr:"解放路78号"},{id:7,name:"炭火烧烤",cuisine:"烧烤",emoji:"🍢",rating:4.4,price:55,dist:380,addr:"夜市街15号"},{id:8,name:"韩式烤肉",cuisine:"烧烤",emoji:"🥩",rating:4.6,price:88,dist:650,addr:"新城区28号"},{id:9,name:"寿司の鲜",cuisine:"日料",emoji:"🍣",rating:4.5,price:85,dist:720,addr:"国际广场B1"},{id:10,name:"首尔拌饭",cuisine:"韩餐",emoji:"🍚",rating:4.3,price:42,dist:510,addr:"韩式料理街3号"},{id:11,name:"意式披萨坊",cuisine:"西餐",emoji:"🍕",rating:4.4,price:68,dist:580,addr:"欧陆风情街8号"},{id:12,name:"麦当劳",cuisine:"快餐",emoji:"🍟",rating:4.0,price:30,dist:200,addr:"中心广场旁"},{id:13,name:"黄焖鸡米饭",cuisine:"快餐",emoji:"🍗",rating:4.2,price:20,dist:120,addr:"学校旁边"},{id:14,name:"喜茶",cuisine:"奶茶",emoji:"🧋",rating:4.6,price:28,dist:400,addr:"购物中心1楼"},{id:15,name:"蜜雪冰城",cuisine:"奶茶",emoji:"🍦",rating:4.3,price:8,dist:100,addr:"学校门口"}];
var COUPONS={美团:[{a:5,c:"满30可用",t:"美团外卖红包"},{a:8,c:"满50可用",t:"美团神券"},{a:15,c:"满80可用",t:"美团大额券"}],饿了么:[{a:6,c:"满25可用",t:"饿了么超级红包"},{a:10,c:"满60可用",t:"饿了么大额券"}],抖音:[{a:12,c:"满50可用",t:"抖音团购券"},{a:20,c:"满100可用",t:"抖音限时折扣"}],淘宝:[{a:5,c:"满20可用",t:"淘宝闪购红包"},{a:10,c:"满40可用",t:"淘特优惠券"}]};
var CKW={中餐:["中餐","家常菜","粤菜","川菜","湘菜","面馆","饺子","烧腊"],火锅:["火锅","涮肉"],烧烤:["烧烤","烤肉","串串"],日料:["日料","寿司","日式"],韩餐:["韩餐","韩式","炸鸡"],西餐:["西餐","披萨","牛排","汉堡"],快餐:["快餐","麦当劳","肯德基","黄焖鸡"],奶茶:["奶茶","咖啡","甜品","茶饮"]};
function guessC(n,c){var t=(n+" "+c).toLowerCase();for(var k in CKW)for(var i=0;i<CKW[k].length;i++)if(t.indexOf(CKW[k][i])>=0)return k;return"中餐"}
function emoji(n,c){var t=n+" "+c;if(t.indexOf("火锅")>=0||t.indexOf("涮")>=0)return"🫕";if(t.indexOf("烧烤")>=0||t.indexOf("烤肉")>=0)return"🍢";if(t.indexOf("寿司")>=0||t.indexOf("日料")>=0)return"🍣";if(t.indexOf("面")>=0)return"🍜";if(t.indexOf("饺")>=0)return"🥟";if(t.indexOf("鸡")>=0)return"🍗";if(t.indexOf("茶")>=0||t.indexOf("咖啡")>=0)return"🧋";if(t.indexOf("披萨")>=0)return"🍕";if(t.indexOf("牛排")>=0)return"🥩";if(t.indexOf("汉堡")>=0)return"🍔";return"🍲"}
function fmtD(m){return m<1000?m+"m":(m/1000).toFixed(1)+"km"}

document.addEventListener("DOMContentLoaded",function(){initFilters();doLocate()});

function doLocate(){
    var lt=document.getElementById("locText");
    lt.textContent="正在定位...";
    if(typeof AMap!=="undefined"){
        var geo=new AMap.Geolocation({enableHighAccuracy:true,timeout:10000});
        geo.getCurrentPosition(function(st,r){
            if(st==="complete"){
                S.loc={lat:r.position.lat,lng:r.position.lng};
                lt.textContent=r.formattedAddress||"定位成功";
                initMap(S.loc);
                doSearch(S.loc.lat,S.loc.lng);
            }else{
                lt.textContent="定位失败，请手动搜索";
                S.loc={lat:DEF.lat,lng:DEF.lng};
                initMap(S.loc);
                doSearch(DEF.lat,DEF.lng);
            }
        });
    }else{
        lt.textContent="SDK未加载";
        S.loc={lat:DEF.lat,lng:DEF.lng};
        loadMock();
    }
}

function initMap(loc){
    try{
        S.map=new AMap.Map("mapBox",{zoom:15,center:[loc.lng,loc.lat],resizeEnable:true});
        var m=new AMap.Marker({position:[loc.lng,loc.lat],title:"我的位置"});
        S.map.add(m);
        S.markers.push(m);
    }catch(e){console.warn("地图失败:",e)}
}

function toggleMap(){
    var mb=document.getElementById("mapBox");
    S.mapOpen=!S.mapOpen;
    mb.style.display=S.mapOpen?"block":"none";
    if(S.mapOpen&&S.map){setTimeout(function(){S.map.resize()},100)}
}

function doSearch(lat,lng){
    var list=document.getElementById("rList");
    list.innerHTML='<div class="ld">正在搜索附近餐厅...</div>';
    if(typeof AMap==="undefined"){loadMock();return}
    var ps=new AMap.PlaceSearch({type:"餐饮服务",pageSize:25,pageIndex:1,extensions:"all"});
    ps.searchNearBy("美食",new AMap.LngLat(lng,lat),RADIUS,function(st,res){
        if(st==="complete"&&res.poiList&&res.poiList.pois.length>0){
            var id=1;
            var arr=res.poiList.pois.map(function(p){
                var biz=p.biz_ext||{};
                var r=biz.rating||"4.2";
                var c=biz.cost?parseInt(biz.cost.replace(/\D/g,"")):35;
                var cu=guessC(p.name,p.type||"");
                return{id:id++,name:p.name,cuisine:cu,emoji:emoji(p.name,p.type||""),rating:r,price:c,dist:p.distance,addr:p.address||"暂无地址",latLng:{lat:p.location.lat,lng:p.location.lng}}
            });
            arr.sort(function(a,b){return a.dist-b.dist});
            S.rest=arr;S.filtered=arr.slice();
            renderList();
            toast("找到"+arr.length+"家附近餐厅");
            addMarkers(arr);
        }else{
            toast("未搜到附近餐厅，使用示例数据");
            loadMock();
        }
    });
}

function addMarkers(arr){
    if(!S.map)return;
    S.markers.forEach(function(m){S.map.remove(m)});
    S.markers=[];
    if(S.loc){var um=new AMap.Marker({position:[S.loc.lng,S.loc.lat],title:"我的位置"});S.map.add(um);S.markers.push(um)}
    arr.forEach(function(r){
        if(r.latLng){
            var mk=new AMap.Marker({position:[r.latLng.lng,r.latLng.lat],title:r.name});
            S.map.add(mk);S.markers.push(mk);
        }
    });
    if(S.markers.length>1)S.map.setFitView(S.markers);
}

function loadMock(){
    S.rest=MOCKS.map(function(r){return{id:r.id,name:r.name,cuisine:r.cuisine,emoji:r.emoji,rating:r.rating,price:r.price,dist:Math.floor(Math.random()*1500)+50,addr:r.addr,latLng:null}});
    S.filtered=S.rest.slice();
    renderList();
}

function searchCity(){
    var v=document.getElementById("cityInput").value.trim();
    if(!v){toast("请输入城市名");return}
    var CITYS={北京:{lat:39.9042,lng:116.4074},上海:{lat:31.2304,lng:121.4737},广州:{lat:23.1291,lng:113.2644},深圳:{lat:22.5431,lng:114.0579},杭州:{lat:30.2741,lng:120.1551},成都:{lat:30.5728,lng:104.0668},武汉:{lat:30.5928,lng:114.3055},南京:{lat:32.0603,lng:118.7969},西安:{lat:34.3416,lng:108.9398},重庆:{lat:29.563,lng:106.5516},天津:{lat:39.0842,lng:117.201},苏州:{lat:31.299,lng:120.5853},长沙:{lat:28.2282,lng:112.9388},郑州:{lat:34.7466,lng:113.6254},青岛:{lat:36.0671,lng:120.3826},厦门:{lat:24.4798,lng:118.0894}};
    var loc=CITYS[v];
    if(loc){
        S.loc=loc;
        document.getElementById("locText").textContent=v;
        initMap(loc);
        doSearch(loc.lat,loc.lng);
        toast("已定位到："+v);
    }else{
        toast("试试：北京、上海、广州、深圳等");
    }
}

function initFilters(){
    document.querySelectorAll(".tags").forEach(function(tl){
        tl.addEventListener("click",function(e){
            if(!e.target.classList.contains("tag"))return;
            tl.querySelectorAll(".tag").forEach(function(t){t.classList.remove("on")});
            e.target.classList.add("on");
            var g=tl.id,v=e.target.getAttribute("data-v");
            if(g==="tCuisine")S.f.cuisine=v;
            if(g==="tDist")S.f.dist=v;
            if(g==="tPrice")S.f.price=v;
            applyFilter();
        });
    });
}

function applyFilter(){
    var f=S.rest.slice();
    if(S.f.cuisine!=="all")f=f.filter(function(r){return r.cuisine===S.f.cuisine});
    if(S.f.dist!=="all"){var m=parseInt(S.f.dist);f=f.filter(function(r){return r.dist<=m})}
    if(S.f.price!=="all"){var m=parseInt(S.f.price);f=f.filter(function(r){return r.price<=m})}
    S.filtered=f;
    renderList();
}

function renderList(){
    var list=document.getElementById("rList");
    document.getElementById("cnt").textContent="("+S.filtered.length+"家)";
    if(!S.filtered.length){list.innerHTML='<div class="ld">😅 没有符合条件的餐厅</div>';return}
    S.filtered.sort(function(a,b){return a.dist-b.dist});
    list.innerHTML=S.filtered.map(function(r){
        return '<div class="ri" onclick="selR('+r.id+')"><div class="ri-emoji">'+r.emoji+'</div><div class="ri-info"><div class="ri-name">'+r.name+'</div><div class="ri-meta"><span>⭐ '+r.rating+'</span><span>💰 ¥'+r.price+'/人</span><span>📍 '+fmtD(r.dist)+'</span></div></div><span class="ri-tag">有券</span></div>'
    }).join("");
}

function openBox(){
    if(S.opening)return;
    if(!S.filtered.length){toast("没有符合条件的餐厅");return}
    document.getElementById("resultPage").classList.remove("on");
    document.getElementById("app").style.display="block";
    S.opening=true;
    var b=document.getElementById("box");
    document.getElementById("boxHint").textContent="正在抽取...";
    b.classList.add("open");
    setTimeout(function(){
        var r=S.filtered[Math.floor(Math.random()*S.filtered.length)];
        S.cur=r;
        showResult(r);
        b.classList.remove("open");
        document.getElementById("boxHint").textContent="点击盲盒，揭晓今天吃什么";
        S.opening=false;
    },1000);
}

function showResult(r){
    document.getElementById("app").style.display="none";
    document.getElementById("resultPage").classList.add("on");
    document.getElementById("rEmoji").textContent=r.emoji;
    document.getElementById("rName").textContent=r.name;
    document.getElementById("rDist").textContent=fmtD(r.dist);
    document.getElementById("rRate").textContent=r.rating;
    document.getElementById("rCost").textContent="¥"+r.price;
    document.getElementById("rAddr").textContent="📍 "+r.addr;
    document.getElementById("rTags").innerHTML="<span>"+r.cuisine+"</span>";
    renderCoupons(r);
    document.getElementById("btnGo").onclick=function(){
        if(r.latLng)window.open("https://uri.amap.com/marker?position="+r.latLng.lng+","+r.latLng.lat+"&name="+encodeURIComponent(r.name));
        else toast("🛵 出发去 "+r.name+"！");
    };
    window.scrollTo(0,0);
}

function renderCoupons(r){
    var cl=document.getElementById("cList");
    var all=[];
    for(var p in COUPONS)COUPONS[p].forEach(function(c){if(c.a<=r.price*0.6)all.push({a:c.a,c:c.c,t:c.t,src:p})});
    for(var i=all.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=all[i];all[i]=all[j];all[j]=tmp}
    var sel=all.slice(0,Math.min(3,all.length));
    if(!sel.length){cl.innerHTML='<div class="no-cp">暂无可用优惠券</div>';return}
    cl.innerHTML=sel.map(function(c){
        return '<div class="ci"><div class="ci-l"><div class="amt">¥'+c.a+'</div><div class="cond">'+c.c+'</div></div><div class="ci-r"><div class="ttl">'+c.t+'</div><div class="src">来源：'+c.src+'</div><button onclick="toast(\'✅ 已领取\')">领取</button></div></div>'
    }).join("");
}

function selR(id){var r=S.rest.find(function(i){return i.id===id});if(r){S.cur=r;showResult(r)}}
function goBack(){document.getElementById("resultPage").classList.remove("on");document.getElementById("app").style.display="block";window.scrollTo(0,0)}
function toast(m){var t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2500)}
    </script>
</body>
</html>
