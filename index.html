<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>今天吃什么</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#FFF8F0;color:#2D2D2D;min-height:100vh}
.hdr{background:linear-gradient(135deg,#FF6B35,#FF8F65);padding:16px 20px;position:sticky;top:0;z-index:10}
.loc{color:#fff;font-size:14px;padding:6px 12px;background:rgba(255,255,255,.2);border-radius:20px;display:inline-block}
.sr{display:flex;gap:8px;margin-top:10px}
.sr input{flex:1;padding:8px 12px;border:none;border-radius:12px;font-size:13px;background:rgba(255,255,255,.2);color:#fff;outline:none}
.sr input::placeholder{color:rgba(255,255,255,.6)}
.sr button{padding:8px 16px;border:none;border-radius:12px;background:rgba(255,255,255,.3);color:#fff;font-size:13px;cursor:pointer}
.mn{padding:0 16px 40px;max-width:480px;margin:0 auto}
.ttl{text-align:center;padding:24px 0 16px}
.ttl h1{font-size:32px;font-weight:800;background:linear-gradient(135deg,#FF6B35,#EF476F);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.ttl p{color:#888;font-size:14px;margin-top:4px}
.ba{display:flex;flex-direction:column;align-items:center;padding:16px 0 24px}
.bx{width:140px;height:140px;position:relative;cursor:pointer}
.bx:active{transform:scale(.95)}
.bl{width:150px;height:36px;background:linear-gradient(135deg,#FF6B35,#E55A2B);border-radius:10px 10px 0 0;position:absolute;top:0;left:-5px;z-index:2;transition:all .4s}
.bl::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:36px;height:10px;background:#FFD166;border-radius:5px}
.bb{width:140px;height:104px;background:linear-gradient(180deg,#FF8F65,#FF6B35);border-radius:0 0 14px 14px;position:absolute;top:32px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(255,107,53,.2)}
.bq{font-size:52px;font-weight:900;color:#fff;animation:flt 2s ease-in-out infinite}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.bx.open .bl{transform:translateY(-50px) rotate(-15deg);opacity:0}
.bx.open .bb{animation:shk .4s ease}
@keyframes shk{20%{transform:translateX(-8px) rotate(-2deg)}60%{transform:translateX(8px) rotate(2deg)}}
.bh{margin-top:16px;color:#888;font-size:13px}
.cd{background:#fff;border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.cd h3{font-size:15px;margin-bottom:12px}
.fg{margin-bottom:12px}
.fg:last-child{margin-bottom:0}
.fg label{display:block;font-size:12px;color:#888;margin-bottom:6px}
.tgs{display:flex;flex-wrap:wrap;gap:6px}
.tg{padding:5px 12px;border-radius:16px;font-size:12px;background:#F5F5F5;color:#666;cursor:pointer;border:2px solid transparent}
.tg.on{background:linear-gradient(135deg,#FF6B35,#FF8F65);color:#fff;border-color:#FF6B35}
.ri{display:flex;align-items:center;gap:12px;padding:12px;background:#FAFAFA;border-radius:12px;margin-bottom:8px;cursor:pointer;border:2px solid transparent}
.ri:active{border-color:#FF6B35}
.re{font-size:32px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:10px;flex-shrink:0}
.rn{font-size:14px;font-weight:600}
.rm{display:flex;gap:10px;font-size:11px;color:#888;margin-top:3px}
.rt{font-size:10px;background:linear-gradient(135deg,#FF6B35,#EF476F);color:#fff;padding:2px 8px;border-radius:10px;flex-shrink:0}
.ld{text-align:center;color:#888;padding:24px;font-size:13px}
.mp{width:100%;height:180px;background:#eee;border-radius:12px;margin-top:10px;overflow:hidden}
.mp img{width:100%;height:100%;object-fit:cover}
.pg{display:none;min-height:100vh;background:#FFF8F0}
.pg.on{display:block}
.rh{display:flex;align-items:center;gap:12px;padding:16px 20px;position:sticky;top:0;background:#FFF8F0;z-index:10}
.rh button{background:none;border:none;font-size:15px;color:#FF6B35;cursor:pointer}
.rh h2{font-size:18px}
.rc{background:#fff;border-radius:20px;overflow:hidden;margin:0 16px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
.ri2{padding:28px 20px;text-align:center;background:linear-gradient(135deg,#FF6B35,#FF8F65);color:#fff}
.ri2 .e{font-size:56px;margin-bottom:10px}
.ri2 h2{font-size:22px;margin-bottom:8px}
.ri2 .tg2{display:flex;justify-content:center;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.ri2 .tg2 span{padding:3px 10px;background:rgba(255,255,255,.25);border-radius:10px;font-size:11px}
.ri2 .inf{display:flex;justify-content:center;gap:20px;margin-bottom:10px}
.ri2 .inf div{display:flex;flex-direction:column;align-items:center;gap:3px}
.ri2 .inf div span:first-child{font-size:11px;opacity:.8}
.ri2 .inf div span:last-child{font-size:15px;font-weight:600}
.ri2 .adr{font-size:12px;opacity:.8}
.cp{padding:16px 20px}
.cp h3{font-size:15px;margin-bottom:12px}
.ci{display:flex;border:2px dashed #FFB088;border-radius:12px;overflow:hidden;margin-bottom:8px;background:#FFF9F5}
.cl{padding:10px 14px;text-align:center;min-width:80px;background:linear-gradient(135deg,#FF6B35,#FF8F65);color:#fff}
.cl .am{font-size:24px;font-weight:800;line-height:1}
.cl .cd2{font-size:10px;opacity:.8;margin-top:3px}
.cr{flex:1;padding:10px 14px}
.cr .tl{font-size:13px;font-weight:600;margin-bottom:2px}
.cr .sc{font-size:11px;color:#888;margin-bottom:6px}
.cr button{padding:3px 12px;background:linear-gradient(135deg,#FF6B35,#FF8F65);color:#fff;border:none;border-radius:12px;font-size:11px;cursor:pointer}
.nc{text-align:center;color:#888;font-size:13px;padding:16px}
.ab{display:flex;gap:10px;padding:16px 20px}
.ab button{flex:1;padding:12px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer}
.ab .br{background:#F5F5F5;color:#333}
.ab .bg{background:linear-gradient(135deg,#06D6A0,#00B894);color:#fff}
.ts{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;z-index:999;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
<div class="hdr">
<div class="loc" onclick="doLoc()">📍 <span id="lt">正在定位...</span></div>
<div class="sr"><input id="ci" placeholder="输入城市名（如北京）"><button onclick="doCity()">搜索</button></div>
</div>
<div class="mn">
<div class="ttl"><h1>🍱 今天吃什么</h1><p>选择困难症终结者</p></div>
<div class="ba"><div class="bx" id="bx" onclick="doBox()"><div class="bl"></div><div class="bb"><div class="bq">?</div></div></div><div class="bh" id="bht">点击盲盒，揭晓今天吃什么</div></div>
<div class="cd"><h3>🗺️ 我的位置</h3><div class="mp" id="mapDiv"></div></div>
<div class="cd">
<h3>🎯 筛选偏好</h3>
<div class="fg"><label>菜系</label><div class="tgs" id="fC"><span class="tg on" data-v="all">全部</span><span class="tg" data-v="中餐">中餐</span><span class="tg" data-v="火锅">火锅</span><span class="tg" data-v="烧烤">烧烤</span><span class="tg" data-v="日料">日料</span><span class="tg" data-v="韩餐">韩餐</span><span class="tg" data-v="西餐">西餐</span><span class="tg" data-v="快餐">快餐</span><span class="tg" data-v="奶茶">奶茶</span></div></div>
<div class="fg"><label>距离</label><div class="tgs" id="fD"><span class="tg on" data-v="all">不限</span><span class="tg" data-v="500">500米</span><span class="tg" data-v="1000">1公里</span><span class="tg" data-v="2000">2公里</span></div></div>
<div class="fg"><label>人均</label><div class="tgs" id="fP"><span class="tg on" data-v="all">不限</span><span class="tg" data-v="30">30以下</span><span class="tg" data-v="50">50以下</span><span class="tg" data-v="100">100以下</span></div></div>
</div>
<div class="cd"><h3>🏪 附近餐厅 <small id="cnt"></small></h3><div id="rl"><div class="ld">正在搜索...</div></div></div>
</div>
</div>
<div class="pg" id="rp">
<div class="rh"><button onclick="gobk()">← 返回</button><h2>🎉 今日推荐</h2></div>
<div class="rc">
<div class="ri2"><div class="e" id="pe"></div><h2 id="pn"></h2><div class="tg2" id="pt"></div><div class="inf"><div><span>📍 距离</span><span id="pd"></span></div><div><span>⭐ 评分</span><span id="pr"></span></div><div><span>💰 人均</span><span id="pp"></span></div></div><div class="adr" id="pa"></div></div>
<div class="cp"><h3>🎫 可用优惠</h3><div id="pcl"></div></div>
<div class="ab"><button class="br" onclick="doBox()">🔄 换一个</button><button class="bg" id="pgo">🛵 去这里吃</button></div>
</div>
</div>
<script>
var AK="bec3d90674f1207515e959f4ddbfd512";
var S={loc:null,r:[],f:[],cur:null,fc:"all",fd:"all",fp:"all"};
var M=[
{n:"老王家常菜",c:"中餐",e:"🍳",r:4.5,p:35,d:320,a:"幸福路88号"},
{n:"川味麻辣烫",c:"中餐",e:"🌶️",r:4.3,p:25,d:180,a:"和平街12号"},
{n:"粤式烧腊王",c:"中餐",e:"🦆",r:4.6,p:42,d:560,a:"中山路156号"},
{n:"兰州拉面馆",c:"中餐",e:"🍜",r:4.2,p:18,d:150,a:"建设路23号"},
{n:"海底捞火锅",c:"火锅",e:"🫕",r:4.7,p:120,d:1200,a:"万达广场3楼"},
{n:"小龙坎火锅",c:"火锅",e:"🍲",r:4.5,p:98,d:890,a:"解放路78号"},
{n:"炭火烧烤",c:"烧烤",e:"🍢",r:4.4,p:55,d:380,a:"夜市街15号"},
{n:"韩式烤肉",c:"烧烤",e:"🥩",r:4.6,p:88,d:650,a:"新城区28号"},
{n:"寿司の鲜",c:"日料",e:"🍣",r:4.5,p:85,d:720,a:"国际广场B1"},
{n:"首尔拌饭",c:"韩餐",e:"🍚",r:4.3,p:42,d:510,a:"韩式料理街3号"},
{n:"意式披萨坊",c:"西餐",e:"🍕",r:4.4,p:68,d:580,a:"欧陆风情街8号"},
{n:"麦当劳",c:"快餐",e:"🍟",r:4.0,p:30,d:200,a:"中心广场旁"},
{n:"黄焖鸡米饭",c:"快餐",e:"🍗",r:4.2,p:20,d:120,a:"学校旁边"},
{n:"喜茶",c:"奶茶",e:"🧋",r:4.6,p:28,d:400,a:"购物中心1楼"},
{n:"蜜雪冰城",c:"奶茶",e:"🍦",r:4.3,p:8,d:100,a:"学校门口"}
];
var CP={美团:[{a:5,c:"满30可用",t:"美团红包"},{a:8,c:"满50可用",t:"美团神券"}],饿了么:[{a:6,c:"满25可用",t:"饿了么红包"},{a:10,c:"满60可用",t:"饿了么大额券"}],抖音:[{a:12,c:"满50可用",t:"抖音团购券"},{a:20,c:"满100可用",t:"抖音折扣"}],淘宝:[{a:5,c:"满20可用",t:"淘宝红包"}]};
var CK={中餐:["中餐","家常菜","粤菜","川菜","湘菜","面馆","饺子"],火锅:["火锅","涮肉"],烧烤:["烧烤","烤肉","串串"],日料:["日料","寿司","日式"],韩餐:["韩餐","韩式","炸鸡"],西餐:["西餐","披萨","牛排","汉堡"],快餐:["快餐","麦当劳","肯德基","黄焖鸡"],奶茶:["奶茶","咖啡","甜品","茶饮"]};
var CS={北京:{lat:39.9042,lng:116.4074},上海:{lat:31.2304,lng:121.4737},广州:{lat:23.1291,lng:113.2644},深圳:{lat:22.5431,lng:114.0579},杭州:{lat:30.2741,lng:120.1551},成都:{lat:30.5728,lng:104.0668},武汉:{lat:30.5928,lng:114.3055},南京:{lat:32.0603,lng:118.7969},西安:{lat:34.3416,lng:108.9398},重庆:{lat:29.563,lng:106.5516}};

function gc(n,c){var t=(n+" "+c).toLowerCase();for(var k in CK)for(var i=0;i<CK[k].length;i++)if(t.indexOf(CK[k][i])>=0)return k;return"中餐"}
function ge(n,c){var t=n+" "+c;if(t.indexOf("火锅")>=0)return"🫕";if(t.indexOf("烧烤")>=0||t.indexOf("烤肉")>=0)return"🍢";if(t.indexOf("寿司")>=0)return"🍣";if(t.indexOf("面")>=0)return"🍜";if(t.indexOf("饺")>=0)return"🥟";if(t.indexOf("鸡")>=0)return"🍗";if(t.indexOf("茶")>=0||t.indexOf("咖啡")>=0)return"🧋";if(t.indexOf("披萨")>=0)return"🍕";if(t.indexOf("牛排")>=0)return"🥩";if(t.indexOf("汉堡")>=0)return"🍔";return"🍲"}
function fd(m){return m<1000?m+"m":(m/1000).toFixed(1)+"km"}

document.addEventListener("DOMContentLoaded",function(){initF();doLoc()});

function doLoc(){
var lt=document.getElementById("lt");
lt.textContent="正在定位...";
if(navigator.geolocation){
navigator.geolocation.getCurrentPosition(function(p){
S.loc={lat:p.coords.latitude,lng:p.coords.longitude};
lt.textContent="定位成功";
doSearch(S.loc.lat,S.loc.lng);
showMap(S.loc.lat,S.loc.lng);
},function(){
lt.textContent="定位失败，请手动搜索";
S.loc={lat:39.9042,lng:116.4074};
loadMock();
showMap(39.9042,116.4074);
},{enableHighAccuracy:false,timeout:5000,maximumAge:300000});
}else{
lt.textContent="不支持定位";
S.loc={lat:39.9042,lng:116.4074};
loadMock();
}
}

function showMap(lat,lng){
document.getElementById("mapDiv").innerHTML='<img src="https://restapi.amap.com/v3/staticmap?location='+lng+','+lat+'&zoom=14&size=600*300&markers=size:mid|color:red|label:我|'+lng+','+lat+'&key='+AK+'" alt="地图" onerror="this.src=\'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22600%22 height=%22300%22><rect fill=%22%23f0f0f0%22 width=%22600%22 height=%22300%22/><text x=%22300%22 y=%22150%22 text-anchor=%22middle%22 fill=%22%23999%22 font-size=%2216%22>地图加载失败</text></svg>\'">';
}

function doSearch(lat,lng){
var list=document.getElementById("rl");
list.innerHTML='<div class="ld">正在搜索附近餐厅...('+lat.toFixed(2)+","+lng.toFixed(2)+")</div>";
var cb="cb_"+Date.now();
window[cb]=function(data){
console.log("JSONP回调触发,data:",data);
delete window[cb];
var old=document.getElementById("jsonp");
if(old)old.remove();
if(data&&data.status==="1"&&data.pois&&data.pois.length>0){
var id=0;
var arr=data.pois.map(function(p){
var loc=p.location.split(",");
var plng=parseFloat(loc[0]);
var plat=parseFloat(loc[1]);
var dist=p.distance?parseInt(p.distance):0;
var biz=p.biz_ext||{};
var rating=biz.rating||"4.2";
var cost=biz.cost?parseInt(biz.cost.replace(/\D/g,"")):35;
var cuisine=gc(p.name,p.type||"");
return{id:++id,n:p.name,c:cuisine,e:ge(p.name,p.type||""),r:rating,p:cost,d:dist,a:p.address||"暂无地址",ll:{lat:plat,lng:plng}}
});
arr.sort(function(a,b){return a.d-b.d});
S.r=arr;S.f=arr.slice();
renderR();
toast("找到"+arr.length+"家附近餐厅");
updateMapMarkers(arr);
}else{
toast("未搜到附近餐厅，使用示例数据");
loadMock();
}
};
var sc=document.createElement("script");
sc.id="jsonp";
sc.src="https://restapi.amap.com/v3/place/around?key="+AK+"&location="+lng+","+lat+"&radius=2000&types=050000&offset=25&callback="+cb;
sc.onerror=function(){console.log("JSONP脚本加载失败");delete window[cb];toast("搜索失败");loadMock()};
document.head.appendChild(sc);
console.log("JSONP script added, URL:",sc.src);
setTimeout(function(){if(window[cb]){console.log("JSONP超时,回调未触发");delete window[cb];toast("搜索超时");loadMock()}},8000);
}

function updateMapMarkers(arr){
if(!S.loc)return;
var markers="markers=size:mid|color:red|label:我|"+S.loc.lng+","+S.loc.lat;
arr.slice(0,8).forEach(function(r,i){
if(r.ll)markers+="|size:small|color:blue|label:"+(i+1)+"|"+r.ll.lng+","+r.ll.lat;
});
document.getElementById("mapDiv").innerHTML='<img src="https://restapi.amap.com/v3/staticmap?location='+S.loc.lng+','+S.loc.lat+'&zoom=14&size=600*300&'+markers+'&key='+AK+'" alt="地图" onerror="this.style.display=\'none\'">';
}

function loadMock(){
S.r=M.map(function(r,i){return{id:i+1,n:r.n,c:r.c,e:r.e,r:r.r,p:r.p,d:Math.floor(Math.random()*1500)+50,a:r.a,ll:null}});
S.f=S.r.slice();
renderR();
}

function doCity(){
var v=document.getElementById("ci").value.trim();
if(!v){toast("请输入城市名");return}
var loc=CS[v];
if(loc){
S.loc=loc;
document.getElementById("lt").textContent=v;
doSearch(loc.lat,loc.lng);
showMap(loc.lat,loc.lng);
toast("已定位到："+v);
}else{toast("试试：北京、上海、广州、深圳等")}
}

function initF(){
document.querySelectorAll(".tgs").forEach(function(tl){
tl.addEventListener("click",function(e){
if(!e.target.classList.contains("tg"))return;
tl.querySelectorAll(".tg").forEach(function(t){t.classList.remove("on")});
e.target.classList.add("on");
var g=tl.id,v=e.target.getAttribute("data-v");
if(g==="fC")S.fc=v;
if(g==="fD")S.fd=v;
if(g==="fP")S.fp=v;
applyF();
});
});
}

function applyF(){
var f=S.r.slice();
if(S.fc!=="all")f=f.filter(function(r){return r.c===S.fc});
if(S.fd!=="all"){var m=parseInt(S.fd);f=f.filter(function(r){return r.d<=m})}
if(S.fp!=="all"){var m=parseInt(S.fp);f=f.filter(function(r){return r.p<=m})}
S.f=f;
renderR();
}

function renderR(){
var list=document.getElementById("rl");
document.getElementById("cnt").textContent="("+S.f.length+"家)";
if(!S.f.length){list.innerHTML='<div class="ld">😅 没有符合条件的餐厅</div>';return}
S.f.sort(function(a,b){return a.d-b.d});
list.innerHTML=S.f.map(function(r,i){
return '<div class="ri" onclick="selR('+i+')"><div class="re">'+r.e+'</div><div><div class="rn">'+r.n+'</div><div class="rm"><span>⭐ '+r.r+'</span><span>💰 ¥'+r.p+'/人</span><span>📍 '+fd(r.d)+'</span></div></div><span class="rt">有券</span></div>'
}).join("");
}

function doBox(){
if(!S.f.length){toast("没有符合条件的餐厅");return}
document.getElementById("rp").classList.remove("on");
document.getElementById("app").style.display="block";
var b=document.getElementById("bx");
document.getElementById("bht").textContent="正在抽取...";
b.classList.add("open");
setTimeout(function(){
var r=S.f[Math.floor(Math.random()*S.f.length)];
S.cur=r;
showRes(r);
b.classList.remove("open");
document.getElementById("bht").textContent="点击盲盒，揭晓今天吃什么";
},1000);
}

function showRes(r){
document.getElementById("app").style.display="none";
document.getElementById("rp").classList.add("on");
document.getElementById("pe").textContent=r.e;
document.getElementById("pn").textContent=r.n;
document.getElementById("pd").textContent=fd(r.d);
document.getElementById("pr").textContent=r.r;
document.getElementById("pp").textContent="¥"+r.p;
document.getElementById("pa").textContent="📍 "+r.a;
document.getElementById("pt").innerHTML="<span>"+r.c+"</span>";
renderC(r);
document.getElementById("pgo").onclick=function(){

function renderC(r){
var cl=document.getElementById("pcl");
var all=[];
for(var p in CP)CP[p].forEach(function(c){if(c.a<=r.p*0.6)all.push({a:c.a,c:c.c,t:c.t,s:p})});
for(var i=all.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=all[i];all[i]=all[j];all[j]=tmp}
var sel=all.slice(0,Math.min(3,all.length));
if(!sel.length){cl.innerHTML='<div class="nc">暂无可用优惠券</div>';return}
cl.innerHTML=sel.map(function(c){
return '<div class="ci"><div class="cl"><div class="am">¥'+c.a+'</div><div class="cd2">'+c.c+'</div></div><div class="cr"><div class="tl">'+c.t+'</div><div class="sc">来源：'+c.s+'</div><button onclick="toast(\'✅ 已领取\')">领取</button></div></div>'
}).join("");
}

</script>
